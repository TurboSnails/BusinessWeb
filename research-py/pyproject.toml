[project]
name = "businessweb-research"
version = "0.1.0"
description = "第二套回测引擎与多资产研究（只做研究计算，不进网站构建）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "scipy>=1.14,<2",
  "arch>=7.2,<9",
  "statsmodels>=0.14,<1",
  "akshare>=1.20.70",
  "pyarrow>=26.0.1",
  "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
