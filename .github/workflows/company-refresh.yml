name: Refresh company quotes

# 每个工作日美股收盘后（A 股、港股、美股都已收盘）刷新公司库行情（流程同 docs/data-maintenance.md）：
# 只更新行情与供应商返回字段，原研究模型、评级与研究日期保留；证据精简后留存 14 天。
# 手动全量刷新（含 MCP 公司资料）仍按文档执行。
# 准点触发由 Vercel Cron（vercel.json，UTC 22:00–22:59）调用 workflow_dispatch；下面的 schedule 只作兜底，
# GitHub 排程常迟到 6–10 小时，若 20 小时内已有行情刷新提交则跳过，见「Collect」步骤。
on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: market-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - name: Collect quotes, macro and indexes
        shell: bash
        run: |
          set -euo pipefail
          # 目录与快照日期取纽约日期：UTC 22:00 运行时等于刚收盘的美股交易日，也就是 A/H 股当天；
          # 若用 Asia/Yerevan（UTC+4），22:00 UTC 已是次日，周五收盘会被记成周六。
          D=$(TZ=America/New_York date +%F)
          echo "D=$D" >> "$GITHUB_ENV"
          # 兜底排程：Vercel Cron 已按时触发过（20 小时内有行情刷新提交）就不再跑，避免迟到的排程在亚洲盘中用盘中价覆盖收盘价
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$(git log -1 --since='20 hours ago' --grep='^data(companies): 行情刷新' --format=%H)" ]; then
            echo "SKIP=1" >> "$GITHUB_ENV"; echo "20 小时内已有行情刷新（Vercel Cron 准点触发），兜底排程跳过"; exit 0
          fi
          # 当天已有手动全量刷新（目录存在且无 AUTO.txt）时不覆盖其完整证据
          if [ -d "public/research/data-refresh-$D" ] && [ ! -f "public/research/data-refresh-$D/AUTO.txt" ]; then
            echo "SKIP=1" >> "$GITHUB_ENV"; echo "今日已有手动全量刷新，跳过"; exit 0
          fi
          for k in universe macro indexes; do node scripts/collect-market-refresh.mjs $k "$D"; done
          # Yahoo 匿名会话偶尔失败：留空文件，由腾讯行情兜底
          node scripts/collect-market-refresh.mjs yahoo-quotes "$D" || echo '{"requested":0,"quotes":{},"errors":["yahoo session failed"]}' > "public/research/data-refresh-$D/yahoo-quote-batch.json"
          for m in quotes quotes-etf; do uvx --python 3.12 --from yfinance-mcp-server==1.0.4 python scripts/collect-market-mcp.py --date "$D" --mode $m | tail -c 300; done
      - name: Apply to company data
        if: env.SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/normalize-market-refresh.py --date "$D" | tail -5
          node scripts/collect-market-refresh.mjs apply-companies "$D"
          node scripts/slim-refresh-evidence.mjs "$D"
      - name: Re-rate valuation overlays at the latest prices
        if: env.SKIP != '1'
        # 港股／ADR 估值初稿：盈利输入冻结（2026-10-20），价格取自刚写好的行情快照，评级随价格按规则重算。
        # 必须在行情快照之后、信号台账之前：台账记录「评级+价格」，评级若停在生成日会污染事后复盘。
        run: |
          set -euo pipefail
          python3 scripts/review-hk-valuation-2026-10-20.py | tail -1
          python3 scripts/review-adr-valuation-2026-10-20.py | tail -1
      - name: Record signal ledger
        if: env.SKIP != '1'
        # 每周一期：评级、价格、自动 DCF 与雷达信号，供机会雷达页「信号复盘」事后检验
        run: node scripts/signal-ledger.mjs "$D"
      - name: Validate research data
        if: env.SKIP != '1'
        run: npx vitest run src/data
      - name: Publish
        if: env.SKIP != '1'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add public/data public/research src/data
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data(companies): 行情刷新 $D"
          for attempt in 1 2 3; do
            if git push; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            # 数据文件冲突时以本次新生成的为准
            git rebase -X theirs origin/main
          done
          exit 1
      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
