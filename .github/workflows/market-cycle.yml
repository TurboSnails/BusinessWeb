name: Update market cycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-cycle.yml'
      - 'scripts/market-cycle-*.mjs'
      - 'scripts/market-cycle-*.py'
      - 'scripts/requirements-market-cycle.txt'
      - 'src/features/market-cycle/automation.ts'
      - 'src/features/market-cycle/engine.ts'
  schedule:
    # Low-concurrency, bounded incremental breadth collection; Saturday runs also archive the completed week.
    - cron: '15 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: market-data-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official XLS reader
        run: python -m pip install -r scripts/requirements-market-cycle.txt
      # Keep the old single-path cache key/version so existing HSI breadth history is restored once.
      - uses: actions/cache@v4
        with:
          path: .cache/market-cycle-breadth
          key: market-cycle-breadth-v1-${{ github.run_id }}
          restore-keys: market-cycle-breadth-v1-
      - uses: actions/cache@v4
        with:
          path: |
            .cache/market-cycle-breadth
            .cache/market-cycle-cn-turnover
            .cache/market-cycle-hsi-turnover
          key: market-cycle-evidence-v2-${{ github.run_id }}
          restore-keys: |
            market-cycle-evidence-v2-
            market-cycle-breadth-v1-
      - name: Refresh macro background independently
        continue-on-error: true
        run: node scripts/macro-snapshot.mjs
      - name: Collect, validate and archive cycle evidence
        env:
          MARKET_CYCLE_CACHE_DIR: .cache/market-cycle-breadth
        run: node scripts/market-cycle-update.mjs
      - name: Validate shared rules and pipeline
        run: node --test scripts/market-cycle-*.test.mjs
      - name: Publish valid partial updates and quality report
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add public/data/market-cycle*.json public/data/macro-cn.json public/data/macro-us.json public/data/macro-hk.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data(cycle): 自动证据与质量复盘 $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            # 数据文件冲突时以本次新生成的为准（并发采集同一文件）
            git rebase -X theirs origin/main
          done
          exit 1
      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
