name: ETF timing shadow run

# 第 ② 步：每周六记录一次冻结名单上「择时＋只认金叉」的状态（只存档 data-raw/，不在网站展示，不是买卖指令）。
on:
  schedule:
    # 每周六 UTC 08:00（北京时间 16:00），周五已收盘
    - cron: '0 8 * * 6'
  push:
    branches: [main]
    paths:
      - '.github/workflows/etf-timing-shadow.yml'
      - 'scripts/research/etf-strategy-oos/shadow.mjs'
      - 'scripts/research/etf-strategy-oos/universe.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-publish
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record weekly snapshot
        run: node scripts/research/etf-strategy-oos/shadow.mjs
      - name: Commit if changed
        # 数据不全时脚本以失败退出，但仍提交已取得的快照（标 complete:false）
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          git add data-raw/etf-timing-shadow
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data(etf-timing): 影子运行快照 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
