name: Update THS tabs

# 「三方平台 · 同花顺」除市场情绪外的页签（市场、可转债、数据中心、港股通与AH、ETF资金）：收盘后各跑一次自己的脚本 scripts/ths-<页签>.mjs，
# 产出 public/data/ths-tab-<页签>.json 与 data-raw/ths-tab-<页签>/。单个脚本失败只记警告，不影响其他页签。
# 主触发接在「Update daily analysis」之后（北京 15:35 / 17:10）；兜底北京 18:30（龙虎榜数据约 18 点后公布）。
on:
  workflow_run:
    workflows: ['Update daily analysis']
    types: [completed]
  schedule:
    # 北京 18:30 兜底；中证估值、上交所 ETF 份额等晚间才发布，再在 20:30、22:30、23:30 补跑（脚本幂等，日期未变不写）
    - cron: '30 10 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ths-tabs.yml'
      - 'scripts/ths-*.mjs'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ths-tabs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ETF资金页签解析中证调样公告 PDF（scripts/market-cycle-pdf-text.py 依赖 pypdf）
      - name: Install PDF text extractor
        run: python -m pip install -r scripts/requirements-market-cycle.txt
      - name: Run tab scripts
        shell: bash
        # 每次运行最多 10 分钟，非超时失败且预算充足时重跑一次，预算用完则提交已跑完的结果
        run: |
          run_tab_script() {
            local file=$1 left=$2 limit status=0
            limit=$(( left < 600 ? left : 600 ))
            timeout --kill-after=10 "$limit" node "$file" || status=$?

            if [[ "$status" != 0 && "$status" != 124 && "$status" != 137 ]] && (( budget - SECONDS >= 120 )); then
              echo "$file 运行失败（退出码 $status），30 秒后重跑一次"
              sleep 30
              left=$(( budget - SECONDS ))
              if (( left > 0 )); then
                limit=$(( left < 600 ? left : 600 ))
                status=0
                timeout --kill-after=10 "$limit" node "$file" || status=$?
              fi
            fi

            case "$status" in
              0) return 0 ;;
              124|137) echo "::warning::$file 超时（上限 ${limit} 秒），保留上一份数据" ;;
              *) echo "::warning::$file 运行失败（退出码 $status），保留上一份数据" ;;
            esac
          }

          budget=$(( JOB_MINUTES * 60 - 300 ))
          for tab in market cbond datacenter hk etf screener industry; do
            f="scripts/ths-$tab.mjs"
            [ -f "$f" ] || continue
            left=$(( budget - SECONDS ))
            if [ "$left" -lt 60 ]; then echo "::warning::时间预算用完，跳过 $f 及之后的脚本"; break; fi
            run_tab_script "$f" "$left"
          done
        env:
          JOB_MINUTES: '40' # 与上面的 timeout-minutes 保持一致
      - name: Restore any half-written JSON
        shell: bash
        # 脚本被超时杀掉时可能留下写了一半的文件：解析失败的一律还原成上一版，不提交坏文件
        run: |
          for f in public/data/ths-tab-*.json $(git ls-files -m -o --exclude-standard 'data-raw/' | grep '\.json$' || true); do
            [ -f "$f" ] || continue
            if ! node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" 2>/dev/null; then
              echo "::warning::$f 不是合法 JSON，已还原"
              git checkout -- "$f" 2>/dev/null || rm -f "$f"
            fi
          done
      - name: Commit if changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add public/data/ths-tab-*.json data-raw/ths-tab-* 2>/dev/null || true
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data(ths): 同花顺页签数据 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            if [ "$i" = 5 ]; then echo "::error::推送 5 次都失败"; exit 1; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
