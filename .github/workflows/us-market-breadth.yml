name: Update US market breadth after close

on:
  schedule:
    - cron: '40 16 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: market-data-publish
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: .cache/us-market-breadth
          key: us-market-breadth-v1-${{ github.run_id }}
          restore-keys: us-market-breadth-v1-
      - name: Refresh US constituent breadth
        run: node scripts/us-market-breadth.mjs
      - name: Publish breadth changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add public/data/us-market-breadth.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data(us-market-breadth): 更新美股成分股宽度 $(TZ=America/New_York date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            # Both breadth writers share the publish group. Fail on an unexpected same-file edit.
            git rebase origin/main
          done
          exit 1
      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
