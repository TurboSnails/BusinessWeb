name: Update macro snapshot

on:
  schedule:
    # 工作日美股收盘后（与 company-refresh 同窗）；Vercel Cron 准点派发，本排程作迟到兜底
    - cron: '30 22 * * 1-5'
    # 周六补一轮：周末复盘用（Put/Call、大宗等周五收盘后仍可对齐）
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: market-data-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Fetch FRED / Yahoo / Eastmoney data
        run: |
          node scripts/macro-snapshot.mjs
          node scripts/index-snapshot.mjs
          node scripts/market-cycle-snapshot.mjs
          node scripts/macro-posture.mjs || echo "::warning::Macro posture refresh failed"
          node scripts/macro-posture-research.mjs || echo "::warning::Macro posture candidates refresh failed"
          node scripts/macro-posture-market.mjs || echo "::warning::Macro posture market refresh failed"
          node scripts/market-radar.mjs || echo "::warning::Market radar refresh failed"
      # 前推记录只能追加：已冻结的月末正式定档被改写时任务失败，不提交
      - name: Check live ledger is append-only
        run: node scripts/check-live-ledger.mjs
      - name: Update vol-target shadow readings (frozen months are never rewritten)
        run: node scripts/vol-target-shadow.mjs
      - name: Update late-cycle warning shadow readings (frozen months are never rewritten)
        run: node scripts/late-cycle-shadow.mjs
      # 抓取或计算失败只发 warning；退出码 2 表示已冻结的行被改写，此时任务失败
      - name: Update defensive-tilt ETF shadow run (frozen months are never rewritten)
        shell: bash
        run: |
          set +e
          node scripts/defensive-tilt-shadow.mjs
          code=$?
          if [ "$code" -eq 2 ]; then exit 1; fi
          if [ "$code" -ne 0 ]; then echo "::warning::Defensive-tilt shadow refresh failed"; fi
      # 板块轮动影子运行（L-037）：同样只在冻结行被改写时失败
      - name: Update sector-rotation ETF shadow run (frozen months are never rewritten)
        shell: bash
        run: |
          set +e
          node scripts/sector-rotation-shadow.mjs
          code=$?
          if [ "$code" -eq 2 ]; then exit 1; fi
          if [ "$code" -ne 0 ]; then echo "::warning::Sector-rotation shadow refresh failed"; fi
      - name: Commit if changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add public/data/macro-us.json public/data/macro-cn.json public/data/macro-hk.json public/data/index-history.json public/data/market-cycle.json public/data/macro-posture.json public/data/macro-posture-candidates.json data-raw/macro-posture-vintages/ data-raw/macro-posture-vintage-history/ public/data/macro-posture-market.json data-raw/macro-posture-market/ public/data/macro-posture-daily.json data-raw/macro-posture-daily/ public/data/market-radar.json public/data/combined-strategy.json data-raw/market-radar/ public/data/vol-target-shadow.json public/data/late-cycle-shadow.json public/data/defensive-tilt-shadow.json data-raw/defensive-tilt-shadow/ public/data/sector-rotation-shadow.json data-raw/sector-rotation-shadow/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data(macro): 更新宏观温度数据 $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Action 用 GITHUB_TOKEN 推送不会触发其他工作流，这里手动触发 Pages 部署（Vercel 由其 GitHub 应用照常部署）
      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      # 月初检查上月底定档是否生成；上面各脚本失败只打警告，这一步失败会让任务标红并发通知
      - name: Check month-end tier freshness
        run: node scripts/check-strategy-freshness.mjs
