name: Update AI token economics

on:
  schedule:
    # 每月 16 日 UTC 06:00：Ramp AI Index 按周更新，月中取一期最新完整周
    - cron: '0 6 16 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: market-data-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 抓取或解析失败时脚本非零退出，Action 报红，不提交残缺数据
      - name: Fetch Ramp AI Index
        run: node scripts/ai-token-economics.mjs
      - name: Commit if changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/features/ai-token-economics/snapshots.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/ai-token-economics/snapshots.json
          git commit -m "data(ai-token): 更新 Ramp AI Index $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
