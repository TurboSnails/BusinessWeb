name: Update daily analysis

on:
  schedule:
    # 北京时间交易日 15:35 首次归档、17:10 再核验；休市由实际行情日期识别，不写入虚构日期。
    - cron: '35 7 * * 1-5'
    - cron: '10 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-analysis-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect and archive verified daily market data
        run: node scripts/daily-analysis-snapshot.mjs
      - name: Backfill missed trading days
        # GitHub 定时任务常延迟数小时，跑到次日凌晨时当天收盘快照已取不到；回补最近 7 个交易日的缺口（只补缺失日期，不改已有归档）
        run: node scripts/daily-analysis-backfill.mjs 7 || echo "::warning::回补失败，保留已有归档"
      - name: Commit updated public market snapshot
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/daily-analysis.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/daily-analysis.json
          git commit -m "data(daily-analysis): archive verified market snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
