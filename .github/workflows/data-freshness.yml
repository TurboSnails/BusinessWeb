name: Data freshness monitor

# 每日巡检数据文件里的真实观测日期与各定时工作流的最近结论（scripts/data-freshness-check.mjs）。
# 有告警：创建或更新唯一一个带 data-freshness 标签的 issue；告警项变化时追加评论（正文编辑不会通知订阅者）。
# 无告警：若该 issue 仍开着，评论后关闭。不提交任何报告文件，仓库保持干净。
on:
  schedule:
    # UTC 23:20（北京 07:20）：晚于所有数据任务的名义时间；GitHub 排程常迟到 7–9 小时，
    # 判定按脚本实际运行时刻推算各市场「应已落地」的交易日，迟到不会造成误报。
    - cron: '20 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: data-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: 数据新鲜度告警
      ISSUE_LABEL: data-freshness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check data freshness
        run: node scripts/data-freshness-check.mjs --json "$RUNNER_TEMP/freshness.json" --md "$RUNNER_TEMP/freshness.md"
      - name: Job summary
        run: cat "$RUNNER_TEMP/freshness.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Sync alarm issue
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/freshness.md"
          alarm=$(node -p "require(process.env.RUNNER_TEMP + '/freshness.json').alarm")
          fingerprint=$(node -p "require(process.env.RUNNER_TEMP + '/freshness.json').fingerprint")
          alarm_ids=$(node -p "require(process.env.RUNNER_TEMP + '/freshness.json').alarmIds.map(id => '\`' + id + '\`').join('、')")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create "$ISSUE_LABEL" --color D93F0B --description '数据新鲜度巡检自动告警' 2>/dev/null || true
          number=$(gh issue list --state open --label "$ISSUE_LABEL" --limit 20 --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [ "$alarm" = "true" ]; then
            if [ -z "$number" ]; then
              gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file "$report"
              exit 0
            fi
            previous=$(gh issue view "$number" --json body --jq '.body' | sed -n 's/.*freshness-fingerprint: \([0-9a-f]*\).*/\1/p' | head -1)
            gh issue edit "$number" --body-file "$report"
            if [ "$previous" != "$fingerprint" ]; then
              gh issue comment "$number" --body "告警项有变化（$(date -u +'%Y-%m-%d %H:%M') UTC）：${alarm_ids}。正文已更新，运行记录：${run_url}"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "$(date -u +'%Y-%m-%d %H:%M') UTC 巡检已无告警，自动关闭。运行记录：${run_url}"
            gh issue close "$number"
          fi
