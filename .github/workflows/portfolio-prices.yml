name: Update portfolio prices

on:
  schedule:
    - cron: '45 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - name: Collect prices
        id: collect
        continue-on-error: true
        run: node scripts/portfolio-prices.mjs
      - name: Commit updated prices
        shell: bash
        run: |
          set -euo pipefail
          git add public/data/portfolio-prices/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data(portfolio-prices): 更新组合回测价格 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main
          done
          exit 1
      - name: Report collection failure
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
